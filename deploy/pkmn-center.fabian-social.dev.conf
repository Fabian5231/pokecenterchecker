# nginx-Reverse-Proxy fuer PCAlerts  ->  pkmn-center.fabian-social.dev
#
# Dies ist die HTTP-Ausgangsversion (Port 80). Certbot ergaenzt beim Ausfuehren
# automatisch den 443-SSL-Block und die HTTP->HTTPS-Weiterleitung - genau wie
# bei deinem bestehenden Dienst bnr.fabian-social.dev.
#
# Installation siehe deploy/DEPLOY.md

server {
    listen 80;
    server_name pkmn-center.fabian-social.dev;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
